<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111D08">
<title>No_F – Controle de Fiado</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --g-dark:#1E3A08;--g-main:#3B6D11;--g-mid:#4A8018;--g-btn:#4A7C1A;
  --g-light:#5A9B22;--g-pale:#EAF3DC;--g-bg:#F5F8F0;
  --orange:#E07A2B;--orange-bg:#FEF1E6;--red:#D13030;--red-bg:#FDEAEA;
  --white:#FFFFFF;--gray-50:#F9F9F7;--gray-100:#F0F0EC;--gray-200:#E0E0D8;
  --gray-400:#A8A89E;--gray-600:#6A6A60;--gray-700:#4A4A44;--gray-800:#252520;
}

/* ── LAYOUT ADAPTATIVO: desktop mostra moldura de celular, mobile vai fullscreen ── */
body{
  font-family:'DM Sans',sans-serif;
  background:#111D08;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Desktop: header + moldura */
.app-header{text-align:center;padding:32px 16px 24px;color:#fff;width:100%;}
.app-header h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.app-header h1 span{color:#8DC948}
.app-header p{font-size:.82rem;color:#7CA84A;margin-top:4px;letter-spacing:.5px;}
.db-badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:rgba(90,155,34,.15);border:1px solid rgba(90,155,34,.3);
  border-radius:20px;padding:4px 12px;font-size:.72rem;color:#8DC948;}
.db-dot{width:6px;height:6px;border-radius:50%;background:#8DC948;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.phone-wrap{padding-bottom:48px;}
.phone{width:320px;background:#0A0A0A;border-radius:44px;padding:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;}
.phone::before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:90px;height:5px;background:#1a1a1a;border-radius:3px;}
.phone-screen{background:#fff;border-radius:32px;overflow:hidden;height:640px;
  display:flex;flex-direction:column;position:relative;}

/* Mobile: ocupa tela toda */
@media(max-width:480px){
  body{background:#fff;padding:0;}
  .app-header{display:none;}
  .phone-wrap{padding:0;width:100%;}
  .phone{width:100%;border-radius:0;padding:0;background:transparent;
    box-shadow:none;}
  .phone::before{display:none;}
  .phone-screen{border-radius:0;height:100dvh;height:100vh;}
}

/* ── STATUS BAR ── */
.status-bar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 18px 4px;font-size:.7rem;font-weight:600;flex-shrink:0;}
.status-bar.dark{background:var(--g-dark);color:rgba(255,255,255,.9)}
.status-bar.light{background:#fff;color:var(--gray-800)}
@media(max-width:480px){.status-bar{display:none;}}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;justify-content:space-around;align-items:center;
  padding:10px 8px 12px;border-top:1px solid var(--gray-200);background:#fff;
  flex-shrink:0;}
@media(max-width:480px){
  .bottom-nav{padding:10px 8px env(safe-area-inset-bottom,12px);}
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.6rem;color:var(--gray-400);font-weight:500;cursor:pointer;
  padding:4px 12px;border-radius:8px;transition:color .15s;}
.bn-item.active{color:var(--g-btn)}
.bn-item svg{width:18px;height:18px}
.bn-plus{width:40px;height:40px;border-radius:50%;background:var(--g-btn);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;
  margin-top:-18px;box-shadow:0 3px 10px rgba(74,124,26,.4);cursor:pointer;
  transition:transform .15s;}
.bn-plus:active{transform:scale(.92)}

/* ── SCREEN BODY ── */
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.screen-body::-webkit-scrollbar{display:none}

/* ── LOADING ── */
.screen-loading{background:var(--g-dark);height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;}
.loading-ring{width:48px;height:48px;border:3px solid rgba(255,255,255,.1);
  border-top-color:#8DC948;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.8rem;color:rgba(255,255,255,.5);}

/* ── SPLASH / LOGIN ── */
.screen-splash{background:var(--g-dark);height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 28px;}
.splash-logo-ring{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.splash-logo-ring svg{width:36px;height:36px;color:#fff}
.splash-app-name{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;
  color:#fff;letter-spacing:-2px;line-height:1;}
.splash-tagline{font-size:.8rem;color:rgba(255,255,255,.55);margin-bottom:36px;margin-top:4px;}
.splash-field{width:100%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);
  border-radius:10px;padding:13px 16px;color:#fff;font-family:'DM Sans',sans-serif;
  font-size:1rem;margin-bottom:10px;outline:none;-webkit-appearance:none;}
.splash-field::placeholder{color:rgba(255,255,255,.45)}
.splash-field:focus{border-color:rgba(141,201,72,.6)}
.btn-primary{width:100%;padding:15px;background:var(--g-light);color:#fff;border:none;
  border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;
  cursor:pointer;margin-top:6px;transition:background .15s;-webkit-appearance:none;}
.btn-primary:active{background:var(--g-mid)}
.splash-error{font-size:.8rem;color:#ff8080;margin-top:8px;text-align:center;min-height:18px;}
.splash-db-info{font-size:.7rem;color:rgba(141,201,72,.55);margin-top:24px;text-align:center;line-height:1.7;}
.splash-db-info strong{color:rgba(141,201,72,.85)}

/* ── DASHBOARD ── */
.dash-header{background:var(--g-dark);padding:14px 18px 18px;color:#fff;flex-shrink:0;}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;}
.dash-greeting{font-size:.8rem;color:rgba(255,255,255,.65)}
.dash-avatar{width:36px;height:36px;border-radius:50%;background:var(--g-light);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:700;cursor:pointer;transition:opacity .15s;}
.dash-avatar:active{opacity:.7}
.dash-total-label{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:16px}
.dash-total-value{font-size:2rem;font-weight:700;color:#fff;letter-spacing:-1px;line-height:1.1}
.dash-subtitle{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:2px}
.dash-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 0;}
.dash-card{background:var(--g-bg);border-radius:10px;padding:10px 12px;}
.dash-card-label{font-size:.68rem;color:var(--gray-600)}
.dash-card-value{font-size:1rem;font-weight:700;color:var(--gray-800);margin-top:2px}
.dash-card-value.red{color:var(--red)}
.dash-devedores{padding:0 14px;margin-top:12px;}
.dash-section-title{font-size:.72rem;font-weight:600;color:var(--gray-600);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.client-row{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.client-row:last-child{border-bottom:none}
.client-row:active{background:var(--gray-50)}

/* ── AVATARES ── */
.avatar-circle{border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
.client-info{flex:1;min-width:0;}
.client-name{font-size:.82rem;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.client-meta{font-size:.68rem;color:var(--gray-400)}
.client-value{font-size:.85rem;font-weight:700;color:var(--red);text-align:right;white-space:nowrap;}

/* ── LISTA CLIENTES ── */
.list-header{padding:16px 16px 12px;flex-shrink:0;}
.list-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.list-title{font-size:1.3rem;font-weight:700;color:var(--gray-800)}
.dot-online{width:8px;height:8px;border-radius:50%;background:var(--g-light);}
.btn-add-text{font-size:.78rem;color:var(--g-btn);cursor:pointer;font-weight:600;
  padding:6px 12px;background:var(--g-pale);border-radius:20px;}
.search-box{width:100%;background:var(--gray-100);border:none;border-radius:10px;
  padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--gray-800);
  outline:none;margin-bottom:10px;-webkit-appearance:none;}
.search-box::placeholder{color:var(--gray-400)}
.filter-tabs{display:flex;gap:6px;margin-bottom:4px}
.filter-tab{padding:6px 14px;border-radius:20px;border:1.5px solid var(--gray-200);
  font-size:.72rem;font-weight:600;background:#fff;color:var(--gray-600);cursor:pointer;
  transition:.1s;-webkit-appearance:none;}
.filter-tab.active{background:var(--g-btn);border-color:var(--g-btn);color:#fff;}
.client-list-item{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.client-list-item:active{background:var(--gray-50)}
.cli-info{flex:1;min-width:0;}
.cli-name{font-size:.85rem;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cli-time{font-size:.68rem;color:var(--gray-400)}
.cli-right{text-align:right;flex-shrink:0;}
.cli-value{font-size:.85rem;font-weight:700;color:var(--red)}
.cli-status{font-size:.65rem;font-weight:600;margin-top:2px}
.cli-status.devendo{color:var(--red)}
.cli-status.quite{color:var(--g-light)}
.chevron{color:var(--gray-300);font-size:.8rem;margin-left:2px}

/* ── PERFIL CLIENTE ── */
.profile-header{padding:12px 16px 16px;flex-shrink:0;}
.back-link{font-size:.78rem;color:var(--g-btn);display:flex;align-items:center;gap:4px;
  margin-bottom:12px;cursor:pointer;width:fit-content;}
.profile-top{display:flex;align-items:center;gap:12px}
.profile-name{font-size:1rem;font-weight:700;color:var(--gray-800)}
.profile-phone{font-size:.75rem;color:var(--gray-400)}
.profile-balances{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px;}
.balance-box{background:var(--gray-50);border-radius:10px;padding:10px 12px;}
.balance-label{font-size:.68rem;color:var(--gray-600)}
.balance-value{font-size:1.05rem;font-weight:700;color:var(--gray-800);margin-top:2px}
.balance-value.red{color:var(--red)}
.profile-actions{display:flex;gap:8px;padding:0 16px 14px;}
.btn-action{flex:1;padding:11px;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.78rem;font-weight:600;border:none;cursor:pointer;transition:.1s;
  -webkit-appearance:none;}
.btn-action:active{opacity:.8}
.btn-green{background:var(--g-btn);color:#fff}
.btn-outline{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-200)}
.btn-red-outline{background:#fff;color:var(--red);border:1.5px solid #F5C0C0}
.hist-section{padding:0 16px 16px;}
.hist-item{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--gray-100);}
.hist-icon{width:30px;height:30px;border-radius:8px;background:var(--red-bg);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;
  color:var(--red);flex-shrink:0;}
.hist-icon.pag{background:var(--g-pale);color:var(--g-btn)}
.hist-desc{font-size:.82rem;font-weight:500;color:var(--gray-800)}
.hist-date{font-size:.67rem;color:var(--gray-400);margin-top:1px}
.hist-value{font-size:.85rem;font-weight:700;color:var(--red);margin-left:auto;white-space:nowrap;}
.hist-value.green{color:var(--g-btn)}

/* ── LANÇAMENTO ── */
.launch-header{padding:14px 16px 12px;flex-shrink:0;}
.launch-title{font-size:1.1rem;font-weight:700;color:var(--gray-800);margin-bottom:12px}
.tab-pills{display:flex;gap:6px;}
.tab-pill{padding:7px 18px;border-radius:20px;border:1.5px solid var(--gray-200);
  font-size:.8rem;font-weight:600;background:#fff;color:var(--gray-600);cursor:pointer;
  transition:.1s;-webkit-appearance:none;}
.tab-pill.active{background:var(--g-btn);border-color:var(--g-btn);color:#fff;}
.launch-body{padding:14px 16px}
.field-label{font-size:.72rem;font-weight:600;color:var(--gray-600);margin-bottom:5px;margin-top:2px;}
.field-input{width:100%;background:var(--gray-100);border:1.5px solid var(--gray-200);
  border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:.95rem;
  color:var(--gray-800);outline:none;margin-bottom:12px;-webkit-appearance:none;
  transition:border-color .15s;}
.field-input:focus{border-color:var(--g-btn);background:#fff;}
.client-selector{display:flex;align-items:center;gap:8px;padding:12px 14px;
  background:var(--gray-100);border-radius:10px;margin-bottom:12px;cursor:pointer;
  border:1.5px solid var(--gray-200);transition:.1s;}
.client-selector:active{background:var(--gray-200)}
.cs-name{font-size:.9rem;font-weight:600;color:var(--gray-800)}
.cs-arrow{font-size:.75rem;color:var(--g-btn);margin-left:auto}
.saldo-alert{background:var(--red-bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;}
.sa-label{font-size:.68rem;color:var(--red);font-weight:600}
.sa-value{font-size:1.1rem;font-weight:700;color:var(--red)}
.btn-save{width:100%;padding:15px;background:var(--g-btn);color:#fff;border:none;
  border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;
  cursor:pointer;margin-bottom:10px;-webkit-appearance:none;transition:.1s;}
.btn-save:active{background:var(--g-mid)}
.btn-cancel{width:100%;padding:13px;background:#fff;color:var(--gray-600);
  border:1.5px solid var(--gray-200);border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:500;cursor:pointer;-webkit-appearance:none;}

/* ── RELATÓRIO ── */
.report-header{padding:14px 16px 12px;flex-shrink:0;}
.report-title{font-size:1.2rem;font-weight:700;color:var(--gray-800);margin-bottom:12px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.report-box{background:var(--gray-50);border-radius:10px;padding:10px 12px}
.rb-label{font-size:.68rem;color:var(--gray-600)}
.rb-value{font-size:1rem;font-weight:700;margin-top:2px}
.rb-value.green{color:var(--g-main)}
.rb-value.red{color:var(--red)}
.rb-value.orange{color:var(--orange)}
.rb-value.dark{color:var(--gray-800)}
.alert-banner{background:var(--orange);border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ab-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0}
.ab-text{font-size:.78rem;font-weight:600;color:#fff}
.section-label{font-size:.72rem;font-weight:600;color:var(--gray-600);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.report-client-row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--gray-100);}
.cobrar-btn{display:flex;align-items:center;gap:6px;background:var(--g-btn);color:#fff;
  border-radius:20px;padding:9px 14px;font-size:.78rem;font-weight:600;cursor:pointer;
  margin:8px 0;border:none;-webkit-appearance:none;}
.cobrar-btn svg{width:15px;height:15px;flex-shrink:0;}

/* ── CADASTRO ── */
.cadastro-header{padding:14px 16px 12px;flex-shrink:0;}
.cad-back{font-size:.78rem;color:var(--g-btn);cursor:pointer;margin-bottom:6px;width:fit-content;}
.cad-title{font-size:1.2rem;font-weight:700;color:var(--gray-800)}
.cad-body{padding:14px 16px}

/* ── CONFIGURAÇÕES ── */
.settings-header{padding:14px 16px 10px;flex-shrink:0;}
.settings-section{padding:0 16px 24px;}
.settings-group{background:var(--gray-50);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.settings-item{display:flex;align-items:center;gap:10px;padding:13px 14px;
  border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.settings-item:last-child{border-bottom:none}
.settings-item:active{background:var(--gray-200)}
.si-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:.95rem;flex-shrink:0;}
.si-text{flex:1}
.si-label{font-size:.85rem;font-weight:600;color:var(--gray-800)}
.si-desc{font-size:.68rem;color:var(--gray-400);margin-top:1px}
.si-arrow{font-size:.8rem;color:var(--gray-400)}
.db-info-box{background:var(--g-pale);border-radius:12px;padding:13px 14px;margin:0 16px 14px;}
.dib-title{font-size:.7rem;font-weight:700;color:var(--g-main);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.6px;}
.dib-row{display:flex;justify-content:space-between;margin-bottom:4px;}
.dib-key{font-size:.72rem;color:var(--gray-600)}
.dib-val{font-size:.72rem;font-weight:600;color:var(--gray-800);text-align:right;max-width:55%;}

/* ── MODAL / OVERLAY ── */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:flex-end;border-radius:inherit;overflow:hidden;}
.modal-sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 32px;
  max-height:75%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-title{font-size:1rem;font-weight:700;color:var(--gray-800);margin-bottom:16px}
.modal-client-item{display:flex;align-items:center;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s;}
.modal-client-item:last-child{border-bottom:none}
.modal-client-item:active{background:var(--gray-50)}

/* ── TOAST ── */
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--g-dark);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:.8rem;font-weight:600;z-index:100;white-space:nowrap;
  animation:fadeUpDown 2.5s ease forwards;pointer-events:none;}
@keyframes fadeUpDown{
  0%{opacity:0;transform:translateX(-50%) translateY(10px)}
  15%{opacity:1;transform:translateX(-50%) translateY(0)}
  80%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-6px)}
}

/* ── CONFIRM DIALOG ── */
.confirm-dialog{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;border-radius:inherit;}
.confirm-box{background:#fff;border-radius:16px;padding:22px;margin:24px;width:100%;}
.confirm-title{font-size:1rem;font-weight:700;color:var(--gray-800);margin-bottom:6px}
.confirm-text{font-size:.82rem;color:var(--gray-600);margin-bottom:18px;line-height:1.5}
.confirm-btns{display:flex;gap:8px;}
.confirm-btn{flex:1;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.88rem;font-weight:600;border:none;cursor:pointer;-webkit-appearance:none;}
.confirm-btn.cancel{background:var(--gray-100);color:var(--gray-700)}
.confirm-btn.danger{background:var(--red);color:#fff}
</style>
</head>
<body>

<!-- Mostrado apenas no desktop -->
<div class="app-header">
  <h1>No<span>_F</span></h1>
  <p>CONTROLE DE FIADO · Paulo Eduardo Ananias · Fatec Ourinhos 2026</p>
  <div class="db-badge">
    <div class="db-dot"></div>
    <span id="dbStatusText">Inicializando...</span>
  </div>
</div>

<div class="phone-wrap">
  <div class="phone">
    <div class="phone-screen" id="phoneScreen"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  NO_F v3.0 — IndexedDB Nativo
//  Banco de dados: IndexedDB (API Web nativa, W3C)
//  Object Stores (equivalente a tabelas):
//    • usuarios   — autenticação
//    • clientes   — cadastro de clientes
//    • transacoes — lançamentos de fiado e pagamento
//  Funciona 100% offline, sem dependências externas.
//  Compatível com GitHub Pages, Netlify e qualquer servidor estático.
// ═══════════════════════════════════════════════════════════════════

const DB_NAME    = 'nof_db';
const DB_VERSION = 1;
const COLORS = ['#2E7D32','#8B4513','#1565C0','#6A1B9A','#00695C','#E65100','#37474F','#880E4F'];
let colorIdx = 0;

// ─── ESTADO GLOBAL ────────────────────────────────────────────────
const state = {
  idb: null,          // instância do IndexedDB
  user: null,
  clients: [],        // cache em memória
  activeClientId: null,
  screen: 'loading',
  prevScreen: null,
  launchMode: 'fiado',
  filterClients: 'todos',
  searchQuery: '',
};

// ═══════════════════════════════════════════════════════════════════
//  CAMADA IndexedDB
// ═══════════════════════════════════════════════════════════════════

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const db = e.target.result;

      // Object Store: usuarios
      if(!db.objectStoreNames.contains('usuarios')){
        const us = db.createObjectStore('usuarios', { keyPath: 'id', autoIncrement: true });
        us.createIndex('usuario', 'usuario', { unique: true });
      }

      // Object Store: clientes
      if(!db.objectStoreNames.contains('clientes')){
        db.createObjectStore('clientes', { keyPath: 'id', autoIncrement: true });
      }

      // Object Store: transacoes
      if(!db.objectStoreNames.contains('transacoes')){
        const tx = db.createObjectStore('transacoes', { keyPath: 'id', autoIncrement: true });
        tx.createIndex('clienteId', 'clienteId', { unique: false });
      }
    };

    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror   = (e) => reject(e.target.error);
  });
}

// Auxiliar: faz uma operação em uma transaction e retorna Promise
function idbOp(storeName, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx    = state.idb.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    const req   = fn(store);
    if(req){
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror   = (e) => reject(e.target.error);
    } else {
      tx.oncomplete = () => resolve();
      tx.onerror    = (e) => reject(e.target.error);
    }
  });
}

// ── USUÁRIOS ──────────────────────────────────────────────────────
function dbGetUser(usuario){
  return new Promise((resolve, reject) => {
    const tx    = state.idb.transaction('usuarios', 'readonly');
    const store = tx.objectStore('usuarios');
    const idx   = store.index('usuario');
    const req   = idx.get(usuario);
    req.onsuccess = (e) => resolve(e.target.result || null);
    req.onerror   = (e) => reject(e.target.error);
  });
}

function dbCreateUser(usuario, senha, nome){
  return idbOp('usuarios', 'readwrite', store =>
    store.add({ usuario, senha, nome, criado_em: new Date().toISOString() })
  );
}

function dbCountUsers(){
  return idbOp('usuarios', 'readonly', store => store.count());
}

// ── CLIENTES ──────────────────────────────────────────────────────
function dbGetAllClients(){
  return idbOp('clientes', 'readonly', store => store.getAll());
}

function dbAddClient(obj){
  return idbOp('clientes', 'readwrite', store =>
    store.add({ ...obj, criado_em: new Date().toISOString() })
  );
}

function dbDeleteClient(id){
  return new Promise(async (resolve, reject) => {
    try {
      // Deleta transações do cliente
      const txIdb = state.idb.transaction(['clientes','transacoes'], 'readwrite');
      const txStore = txIdb.objectStore('transacoes');
      const idx = txStore.index('clienteId');
      const req = idx.getAll(id);
      req.onsuccess = (e) => {
        const txs = e.target.result;
        txs.forEach(t => txStore.delete(t.id));
        txIdb.objectStore('clientes').delete(id);
      };
      txIdb.oncomplete = () => resolve();
      txIdb.onerror = (e) => reject(e.target.error);
    } catch(err){ reject(err); }
  });
}

// ── TRANSAÇÕES ────────────────────────────────────────────────────
function dbGetTransactions(clienteId){
  return new Promise((resolve, reject) => {
    const tx    = state.idb.transaction('transacoes', 'readonly');
    const store = tx.objectStore('transacoes');
    const idx   = store.index('clienteId');
    const req   = idx.getAll(clienteId);
    req.onsuccess = (e) => {
      const txs = (e.target.result || []).sort((a,b) => b.data.localeCompare(a.data));
      resolve(txs);
    };
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbAddTransaction(obj){
  return idbOp('transacoes', 'readwrite', store =>
    store.add({ ...obj, criado_em: new Date().toISOString() })
  );
}

function dbGetAllTransactions(){
  return idbOp('transacoes', 'readonly', store => store.getAll());
}

// Calcula saldo de um cliente
function calcSaldo(transactions){
  return transactions.reduce((acc, t) =>
    t.tipo === 'fiado' ? acc + t.valor : acc - t.valor, 0
  );
}

// Carrega todos os clientes + suas transações para o state
async function loadClientsFromDB(){
  const clients = await dbGetAllClients();
  for(const c of clients){
    c.transactions = await dbGetTransactions(c.id);
    c.saldo = calcSaldo(c.transactions);
    c.ultimaData = c.transactions.length > 0 ? c.transactions[0].data : null;
  }
  state.clients = clients.sort((a,b) => a.nome.localeCompare(b.nome));
}

// Stats para o relatório
async function getStats(){
  const txs = await dbGetAllTransactions();
  const totalFiado = txs.filter(t=>t.tipo==='fiado').reduce((a,t)=>a+t.valor,0);
  const totalPag   = txs.filter(t=>t.tipo==='pag').reduce((a,t)=>a+t.valor,0);
  return { totalFiado, totalPag, totalTx: txs.length };
}

async function getTodayStats(){
  const hoje = today();
  const txs  = await dbGetAllTransactions();
  const fiadoHoje = txs.filter(t=>t.tipo==='fiado'&&t.data===hoje).reduce((a,t)=>a+t.valor,0);
  const pagHoje   = txs.filter(t=>t.tipo==='pag'  &&t.data===hoje).reduce((a,t)=>a+t.valor,0);
  return { fiadoHoje, pagHoje };
}

// ═══════════════════════════════════════════════════════════════════
//  INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════════
async function initApp(){
  try {
    setDbStatus('Abrindo banco de dados...');
    state.idb = await openDB();
    setDbStatus('IndexedDB · pronto ✓');

    const sessionUser = JSON.parse(sessionStorage.getItem('nof_session') || 'null');
    if(sessionUser){
      state.user = sessionUser;
      await loadClientsFromDB();
      state.screen = 'dashboard';
    } else {
      state.screen = 'login';
    }
    render();
  } catch(err){
    console.error('Erro ao inicializar:', err);
    setDbStatus('⚠ Erro no banco');
    state.screen = 'login';
    render();
  }
}

function setDbStatus(txt){
  const el = document.getElementById('dbStatusText');
  if(el) el.textContent = txt;
}

// ═══════════════════════════════════════════════════════════════════
//  UTILITÁRIOS
// ═══════════════════════════════════════════════════════════════════
function fmt(v){ return 'R$ ' + Number(v).toFixed(2).replace('.',','); }

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
}

function relDate(iso){
  if(!iso) return '—';
  const diff = Date.now() - new Date(iso + 'T00:00:00').getTime();
  const days = Math.floor(diff / 86400000);
  if(days === 0) return 'hoje';
  if(days === 1) return 'ontem';
  return `há ${days} dias`;
}

function today(){ return new Date().toISOString().slice(0,10); }

function makeInitials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function nextColor(){
  const c = COLORS[colorIdx % COLORS.length];
  colorIdx++;
  return c;
}

function clientById(id){ return state.clients.find(c => c.id == id); }
function activeClient(){ return clientById(state.activeClientId); }

function toast(msg){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('phoneScreen').appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

// ─── NAVEGAÇÃO ────────────────────────────────────────────────────
function go(screen, prev = null){
  state.prevScreen = prev || state.screen;
  state.screen = screen;
  render();
}

// ─── RENDER PRINCIPAL ─────────────────────────────────────────────
function render(){
  const ps = document.getElementById('phoneScreen');
  ps.innerHTML = '';
  const screens = {
    loading:       renderLoading,
    login:         renderLogin,
    dashboard:     renderDashboard,
    clientes:      renderClientes,
    perfil:        renderPerfil,
    lancamento:    renderLancamento,
    relatorio:     renderRelatorio,
    cadastro:      renderCadastro,
    configuracoes: renderConfiguracoes,
  };
  (screens[state.screen] || renderLogin)(ps);
}

function bottomNav(active){
  const ic = navIcons();
  const div = document.createElement('div');
  div.className = 'bottom-nav';
  div.innerHTML = `
    <div class="bn-item ${active==='home'?'active':''}" data-nav="dashboard">${ic.home}Início</div>
    <div class="bn-item ${active==='clientes'?'active':''}" data-nav="clientes">${ic.users}Clientes</div>
    <div class="bn-plus" id="btnPlus">+</div>
    <div class="bn-item ${active==='relatorio'?'active':''}" data-nav="relatorio">${ic.report}Relatório</div>
  `;

    el.addEventListener('click', () => go(el.dataset.nav));
  });
  div.querySelector('#btnPlus').addEventListener('click', () => {
    state.launchMode = 'fiado';
    go('lancamento');
  });
  return div;
}

function statusBar(dark = false){
  const bar = document.createElement('div');
  bar.className = `status-bar ${dark?'dark':'light'}`;
  const now = new Date();
  bar.innerHTML = `<span>${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}</span><div class="sb-right">●●●</div>`;
  return bar;
}

function avatarEl(obj, size = 32){
  const el = document.createElement('div');
  el.className = 'avatar-circle';
  el.style.cssText = `background:${obj.cor};width:${size}px;height:${size}px;font-size:${size<=32?'.7rem':'.85rem'};`;
  el.textContent = obj.iniciais;
  return el;
}

// ── LOGIN ─────────────────────────────────────────────────────────
function renderLogin(ps){
  const div = document.createElement('div');
  div.className = 'screen-splash';
  div.style.height = '100%';
  div.innerHTML = `
    <div class="splash-logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5,3 19,12 5,21"/></svg>
    </div>
    <div class="splash-app-name">No_F</div>
    <div class="splash-tagline">controle de fiado</div>
    <input id="loginUser" class="splash-field" type="text" placeholder="Usuário" autocomplete="username" autocapitalize="none">
    <input id="loginPass" class="splash-field" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn-primary" id="btnEntrar">Entrar</button>
    <div class="splash-error" id="loginErr"></div>
    <div class="splash-db-info">
      <strong>Banco de dados:</strong> IndexedDB (W3C Web Standard)<br>
      Armazenamento local · funciona offline
    </div>
  `;
  ps.appendChild(div);

  const showErr = (msg) => { div.querySelector('#loginErr').textContent = msg; };

  div.querySelector('#btnEntrar').addEventListener('click', async () => {
    const u = div.querySelector('#loginUser').value.trim();
    const p = div.querySelector('#loginPass').value;
    if(!u || !p){ showErr('Preencha usuário e senha'); return; }

    const existente = await dbGetUser(u);
    if(existente){
      if(existente.senha !== p){ showErr('Usuário ou senha incorretos'); return; }
      state.user = existente;
    } else {
      // Primeiro acesso: cria a conta
      await dbCreateUser(u, p, u);
      state.user = await dbGetUser(u);
    }
    sessionStorage.setItem('nof_session', JSON.stringify(state.user));
    await loadClientsFromDB();
    go('dashboard');
  });

  div.querySelector('#loginPass').addEventListener('keydown', e => {
    if(e.key === 'Enter') div.querySelector('#btnEntrar').click();
  });
}

  const hora        = new Date().getHours();
  const saud        = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';

    <div class="dash-total-value">${fmt(totalAberto)}</div>

  header.querySelector('#dashAvatar').addEventListener('click', () => go('configuracoes','dashboard'));
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';
  body.innerHTML = `
    <div class="dash-cards">
      <div class="dash-card"><div class="dash-card-label">Clientes</div><div class="dash-card-value">${state.clients.length}</div></div>
      <div class="dash-card"><div class="dash-card-label">Com débito</div><div class="dash-card-value red">${comDebito.length}</div></div>
      <div class="dash-card"><div class="dash-card-label">Fiado hoje</div><div class="dash-card-value">${todayStats.fiadoHoje>0?fmt(todayStats.fiadoHoje):'—'}</div></div>
      <div class="dash-card"><div class="dash-card-label">Recebido hoje</div><div class="dash-card-value" style="color:var(--g-main)">${todayStats.pagHoje>0?fmt(todayStats.pagHoje):'—'}</div></div>
    </div>

    </div>
  `;

    row.className = 'client-row';
    row.appendChild(avatarEl(c, 32));
    row.innerHTML += `
      <div class="client-info">
        <div class="client-name">${c.nome}</div>
        <div class="client-meta">${relDate(c.ultimaData)}</div>
      </div>
      <div class="client-value">${fmt(c.saldo)}</div>
    `;
    row.addEventListener('click', () => { state.activeClientId = c.id; go('perfil','dashboard'); });
    body.querySelector('.dash-devedores').appendChild(row);

// ── CLIENTES ──────────────────────────────────────────────────────
async function renderClientes(ps){
  await loadClientsFromDB();
  ps.appendChild(statusBar());

  const header = document.createElement('div');
  header.className = 'list-header';
  header.innerHTML = `
    <div class="list-title-row">
      <div class="list-title">Clientes</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="dot-online"></div>
        <div class="btn-add-text" id="btnAddCli">+ Novo</div>
      </div>
    </div>
    <input class="search-box" id="searchBox" placeholder="Buscar cliente..." value="${state.searchQuery}">
    <div class="filter-tabs">
      <div class="filter-tab ${state.filterClients==='todos'?'active':''}" data-f="todos">Todos</div>
      <div class="filter-tab ${state.filterClients==='devendo'?'active':''}" data-f="devendo">Devedores</div>
      <div class="filter-tab ${state.filterClients==='quite'?'active':''}" data-f="quite">Quite</div>
    </div>
  `;
  header.querySelector('#btnAddCli').addEventListener('click', () => go('cadastro','clientes'));
  header.querySelector('#searchBox').addEventListener('input', e => { state.searchQuery = e.target.value; render(); });
  header.querySelectorAll('[data-f]').forEach(el => el.addEventListener('click', () => { state.filterClients = el.dataset.f; render(); }));
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';

  let list = [...state.clients];
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    list = list.filter(c => c.nome.toLowerCase().includes(q) || (c.telefone||'').includes(q));
  }
  if(state.filterClients === 'devendo') list = list.filter(c => c.saldo > 0);
  if(state.filterClients === 'quite')   list = list.filter(c => c.saldo <= 0);

  if(list.length === 0){
    body.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--gray-400);font-size:.88rem;line-height:1.7">
      ${state.clients.length===0?'Nenhum cliente cadastrado ainda.<br>Toque em <b>+ Novo</b> para começar.':'Nenhum cliente encontrado.'}
    </div>`;
  } else {
    list.forEach(c => {
      const row = document.createElement('div');
      row.className = 'client-list-item';
      row.appendChild(avatarEl(c, 34));
      row.innerHTML += `
        <div class="cli-info">
          <div class="cli-name">${c.nome}</div>
          <div class="cli-time">${c.ultimaData ? relDate(c.ultimaData) : 'sem lançamentos'}</div>
        </div>
        <div class="cli-right">
          <div class="cli-value" style="${c.saldo<=0?'color:var(--gray-400)':''}">${c.saldo>0?fmt(c.saldo):'—'}</div>
          <div class="cli-status ${c.saldo>0?'devendo':'quite'}">${c.saldo>0?'devendo':'quite'}</div>
        </div>
        <span class="chevron">›</span>
      `;
      row.addEventListener('click', () => { state.activeClientId = c.id; go('perfil','clientes'); });
      body.appendChild(row);
    });
  }
  ps.appendChild(body);
  ps.appendChild(bottomNav('clientes'));
}

  if(c.transactions.length === 0){
    hist.innerHTML += `<div style="font-size:.82rem;color:var(--gray-400);padding:12px 0;">Nenhum lançamento ainda.</div>`;
  } else {
    c.transactions.forEach(t => {
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = `
        <div class="hist-icon ${t.tipo==='pag'?'pag':''}">${t.tipo==='fiado'?'F':'P'}</div>
        <div style="flex:1;min-width:0">
          <div class="hist-desc">${t.descricao||'(sem descrição)'}</div>
          <div class="hist-date">${fmtDate(t.data)}</div>
        </div>
        <div class="hist-value ${t.tipo==='pag'?'green':''}">${t.tipo==='fiado'?'−':'+'}${fmt(t.valor)}</div>
      `;
      hist.appendChild(item);
    });
  }
  body.appendChild(hist);
  ps.appendChild(body);
  ps.appendChild(bottomNav('clientes'));
}

function showConfirmDelete(c){
  const ps = document.getElementById('phoneScreen');
  const overlay = document.createElement('div');
  overlay.className = 'confirm-dialog';
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-title">Excluir ${c.nome}?</div>
      <div class="confirm-text">Todos os lançamentos também serão apagados. Esta ação não pode ser desfeita.</div>
      <div class="confirm-btns">
        <button class="confirm-btn cancel" id="cbCancel">Cancelar</button>
        <button class="confirm-btn danger" id="cbDel">Excluir</button>
      </div>
    </div>
  `;
  overlay.querySelector('#cbCancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#cbDel').addEventListener('click', async () => {
    await dbDeleteClient(c.id);
    await loadClientsFromDB();
    go('clientes');
    toast(`${c.nome} excluído`);
  });
  ps.appendChild(overlay);
}

// ── LANÇAMENTO ────────────────────────────────────────────────────
function renderLancamento(ps){
  const preClient = state.prevScreen === 'perfil' ? activeClient() : null;
  let selectedClient = preClient;

  ps.appendChild(statusBar());

  const header = document.createElement('div');
  header.className = 'launch-header';
  header.innerHTML = `
    <div class="launch-title">Novo lançamento</div>
    <div class="tab-pills">
      <div class="tab-pill ${state.launchMode==='fiado'?'active':''}" id="tabFiado">Fiado</div>
      <div class="tab-pill ${state.launchMode==='pag'?'active':''}" id="tabPag">Pagamento</div>
    </div>
  `;
  header.querySelector('#tabFiado').addEventListener('click', () => { state.launchMode='fiado'; ps.innerHTML=''; renderLancamento(ps); });
  header.querySelector('#tabPag').addEventListener('click',   () => { state.launchMode='pag';   ps.innerHTML=''; renderLancamento(ps); });
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';
  const form = document.createElement('div');
  form.className = 'launch-body';

  // Seletor de cliente
  const fieldCli = document.createElement('div');
  fieldCli.innerHTML = `<div class="field-label">Cliente</div>`;
  const clientSel = document.createElement('div');
  clientSel.className = 'client-selector';
  const updateSel = () => {
    clientSel.innerHTML = selectedClient
      ? `<div style="width:26px;height:26px;border-radius:50%;background:${selectedClient.cor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;">${selectedClient.iniciais}</div><span class="cs-name">${selectedClient.nome}</span><span class="cs-arrow">›</span>`
      : `<span class="cs-name" style="color:var(--gray-400)">Selecionar cliente</span><span class="cs-arrow">›</span>`;
  };
  updateSel();
  clientSel.addEventListener('click', () => showClientPicker(ps, c => { selectedClient = c; updateSel(); updateSaldo(); }));
  fieldCli.appendChild(clientSel);
  form.appendChild(fieldCli);

  // Alerta de saldo
  const saldoDiv = document.createElement('div');
  const updateSaldo = () => {
    if(state.launchMode === 'pag' && selectedClient){
      saldoDiv.innerHTML = `<div class="saldo-alert"><div class="sa-label">Saldo devedor</div><div class="sa-value">${fmt(Math.max(0, selectedClient.saldo))}</div></div>`;
    } else { saldoDiv.innerHTML = ''; }
  };
  updateSaldo();
  form.appendChild(saldoDiv);

  // Campos dinâmicos
  if(state.launchMode === 'fiado'){
    const d = document.createElement('div');
    d.innerHTML = `<div class="field-label">Descrição</div><input class="field-input" id="fDesc" type="text" placeholder="Ex: 1 kg arroz, 2 pães...">`;
    form.appendChild(d);
  }

  const dv = document.createElement('div');
  dv.innerHTML = `<div class="field-label">Valor (R$)</div><input class="field-input" id="fValor" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00">`;
  form.appendChild(dv);

  const dd = document.createElement('div');
  dd.innerHTML = `<div class="field-label">Data</div><input class="field-input" id="fData" type="date" value="${today()}">`;
  form.appendChild(dd);

  if(state.launchMode === 'pag'){
    const do_ = document.createElement('div');
    do_.innerHTML = `<div class="field-label">Observação</div><input class="field-input" id="fObs" type="text" placeholder="Opcional">`;
    form.appendChild(do_);
  }

  const btnSave = document.createElement('button');
  btnSave.className = 'btn-save';
  btnSave.textContent = state.launchMode === 'fiado' ? 'Registrar fiado' : 'Confirmar pagamento';
  btnSave.style.marginTop = '8px';
  btnSave.addEventListener('click', async () => {
    if(!selectedClient){ toast('Selecione um cliente'); return; }
    const valor = parseFloat(form.querySelector('#fValor')?.value || '0');
    if(!valor || valor <= 0){ toast('Informe um valor válido'); return; }
    const desc  = state.launchMode === 'fiado'
      ? (form.querySelector('#fDesc')?.value || '')
      : (form.querySelector('#fObs')?.value  || 'Pagamento');
    const data  = form.querySelector('#fData')?.value || today();

    await dbAddTransaction({ clienteId: selectedClient.id, tipo: state.launchMode, valor, descricao: desc, data });
    await loadClientsFromDB();
    state.activeClientId = selectedClient.id;
    toast(state.launchMode === 'fiado' ? `Fiado de ${fmt(valor)} registrado!` : `Pagamento de ${fmt(valor)} confirmado!`);
    go('perfil','clientes');
  });
  form.appendChild(btnSave);
  body.appendChild(form);
  ps.appendChild(body);
  ps.appendChild(bottomNav(''));
}

function showClientPicker(ps, onSelect){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.innerHTML = `<div class="modal-title">Selecionar cliente</div>`;
  if(state.clients.length === 0){
    sheet.innerHTML += `<div style="font-size:.84rem;color:var(--gray-400);">Nenhum cliente cadastrado.</div>`;
  } else {
    state.clients.forEach(c => {
      const item = document.createElement('div');
      item.className = 'modal-client-item';
      item.innerHTML = `
        <div style="width:34px;height:34px;border-radius:50%;background:${c.cor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;">${c.iniciais}</div>
        <div class="cli-info"><div class="cli-name">${c.nome}</div><div class="cli-time">${c.telefone||''}</div></div>
      `;
      item.addEventListener('click', () => { onSelect(c); overlay.remove(); });
      sheet.appendChild(item);
    });
  }
  overlay.appendChild(sheet);
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  ps.appendChild(overlay);
}

// ── RELATÓRIO ─────────────────────────────────────────────────────
async function renderRelatorio(ps){
  await loadClientsFromDB();
  const stats     = await getStats();
  const emAberto  = state.clients.reduce((a,c) => a + Math.max(0, c.saldo), 0);
  const devedores = state.clients.filter(c => c.saldo > 0).sort((a,b) => b.saldo - a.saldo);

  ps.appendChild(statusBar());

  const header = document.createElement('div');
  header.className = 'report-header';
  header.innerHTML = `
    <div class="report-title">Relatório</div>
    <div class="report-grid">
      <div class="report-box"><div class="rb-label">Total fiado</div><div class="rb-value red">${fmt(stats.totalFiado)}</div></div>
      <div class="report-box"><div class="rb-label">Recebido</div><div class="rb-value green">${fmt(stats.totalPag)}</div></div>
      <div class="report-box"><div class="rb-label">Em aberto</div><div class="rb-value orange">${fmt(emAberto)}</div></div>
      <div class="report-box"><div class="rb-label">Devedores</div><div class="rb-value dark">${devedores.length}</div></div>
    </div>
    ${devedores.length>0?`<div class="alert-banner"><div class="ab-dot"></div><div class="ab-text">${devedores.length} cliente${devedores.length>1?'s':''} aguarda${devedores.length===1?'':'m'} cobrança</div></div>`:''}
  `;
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';
  const inner = document.createElement('div');
  inner.style.padding = '0 16px 16px';

  if(devedores.length === 0){
    inner.innerHTML = `<div style="text-align:center;padding:32px 0;font-size:.88rem;color:var(--gray-400);">Nenhum cliente devedor 🎉</div>`;
  } else {
    inner.innerHTML = `<div class="section-label">Clientes em aberto</div>`;
    devedores.forEach(c => {
      const row = document.createElement('div');
      row.className = 'report-client-row';
      row.innerHTML = `
        <div style="width:34px;height:34px;border-radius:50%;background:${c.cor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;">${c.iniciais}</div>
        <div class="cli-info"><div class="cli-name">${c.nome}</div><div class="cli-time">${c.telefone||'—'}</div></div>
        <div class="cli-value">${fmt(c.saldo)}</div>
      `;
      inner.appendChild(row);
      if(c.telefone){
        const btn = document.createElement('button');
        btn.className = 'cobrar-btn';
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.998 0C5.373 0 0 5.373 0 12c0 2.127.557 4.12 1.531 5.845L0 24l6.33-1.508A11.96 11.96 0 0011.998 24C18.625 24 24 18.627 24 12S18.625 0 11.998 0z"/></svg>
        Cobrar ${c.nome.split(' ')[0]} — ${fmt(c.saldo)}`;
        const phone = (c.telefone||'').replace(/\D/g,'');
        const msg = encodeURIComponent(`Olá ${c.nome.split(' ')[0]}, seu saldo em aberto é de ${fmt(c.saldo)}. Quando puder, podemos acertar? 😊`);
        btn.addEventListener('click', () => window.open(`https://wa.me/55${phone}?text=${msg}`,'_blank'));
        inner.appendChild(btn);
      }
    });
  }
  body.appendChild(inner);
  ps.appendChild(body);
  ps.appendChild(bottomNav('relatorio'));

// ── CADASTRO ──────────────────────────────────────────────────────
function renderCadastro(ps){
  ps.appendChild(statusBar());
  const header = document.createElement('div');
  header.className = 'cadastro-header';
  header.innerHTML = `<div class="cad-back" id="cadBack">‹ Clientes</div><div class="cad-title">Novo cliente</div>`;
  header.querySelector('#cadBack').addEventListener('click', () => go('clientes'));
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';
  const form = document.createElement('div');
  form.className = 'cad-body';
  form.innerHTML = `
    <div class="field-label">Nome completo *</div>
    <input class="field-input" id="cadNome" type="text" placeholder="Nome do cliente" autocapitalize="words">
    <div class="field-label">Telefone (WhatsApp)</div>
    <input class="field-input" id="cadTel" type="tel" placeholder="(xx) 9xxxx-xxxx" inputmode="tel">
    <div class="field-label">Limite de crédito (R$)</div>
    <input class="field-input" id="cadLimite" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00">
  `;

  const btnSave = document.createElement('button');
  btnSave.className = 'btn-save';
  btnSave.textContent = 'Salvar cliente';
  btnSave.style.marginTop = '16px';
  btnSave.addEventListener('click', async () => {
    const nome = form.querySelector('#cadNome').value.trim();
    if(!nome){ toast('Informe o nome do cliente'); return; }
    const telefone = form.querySelector('#cadTel').value.trim();
    const limite   = parseFloat(form.querySelector('#cadLimite').value) || 0;
    await dbAddClient({ nome, telefone, limite, cor: nextColor(), iniciais: makeInitials(nome) });
    await loadClientsFromDB();
    toast(`${nome} cadastrado!`);
    go('clientes');
  });
  form.appendChild(btnSave);

  const btnCancel = document.createElement('button');
  btnCancel.className = 'btn-cancel';
  btnCancel.textContent = 'Cancelar';
  btnCancel.addEventListener('click', () => go('clientes'));
  form.appendChild(btnCancel);

  body.appendChild(form);
  ps.appendChild(body);
}

// ── CONFIGURAÇÕES ─────────────────────────────────────────────────

  ps.appendChild(statusBar());
  const stats   = await getStats();
  const clients = await dbGetAllClients();

  const header = document.createElement('div');
  header.className = 'settings-header';
  header.innerHTML = `
    <div class="back-link" id="cfgBack">‹ Início</div>
    <div style="font-size:1.2rem;font-weight:700;color:var(--gray-800)">Configurações</div>
  `;
  header.querySelector('#cfgBack').addEventListener('click', () => go('dashboard'));
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';

  // Info do banco
  const dbBox = document.createElement('div');
  dbBox.className = 'db-info-box';
  dbBox.innerHTML = `
    <div class="dib-title">🗄 Banco de Dados</div>
    <div class="dib-row"><span class="dib-key">Tecnologia</span><span class="dib-val">IndexedDB (W3C)</span></div>
    <div class="dib-row"><span class="dib-key">Object Stores</span><span class="dib-val">usuarios, clientes, transacoes</span></div>
    <div class="dib-row"><span class="dib-key">Clientes</span><span class="dib-val">${clients.length}</span></div>
    <div class="dib-row"><span class="dib-key">Transações</span><span class="dib-val">${stats.totalTx}</span></div>
    <div class="dib-row"><span class="dib-key">Armazenamento</span><span class="dib-val">Local · offline</span></div>
  `;
  body.appendChild(dbBox);

  const section = document.createElement('div');
  section.className = 'settings-section';

  // Usuário
  const grpUser = document.createElement('div');
  grpUser.className = 'settings-group';
  grpUser.innerHTML = `
    <div class="settings-item" style="cursor:default">
      <div class="si-icon" style="background:var(--g-pale)">👤</div>
      <div class="si-text">
        <div class="si-label">${state.user?.nome||'—'}</div>
        <div class="si-desc">Usuário: @${state.user?.usuario||'—'}</div>
      </div>
    </div>
  `;
  section.appendChild(grpUser);

  // Banco
  const grpDB = document.createElement('div');
  grpDB.className = 'settings-group';

  const itemExport = document.createElement('div');
  itemExport.className = 'settings-item';
  itemExport.innerHTML = `
    <div class="si-icon" style="background:#E8F4FD">💾</div>
    <div class="si-text"><div class="si-label">Exportar dados (JSON)</div><div class="si-desc">Backup completo do banco</div></div>
    <span class="si-arrow">›</span>
  `;
  itemExport.addEventListener('click', exportData);
  grpDB.appendChild(itemExport);

  const itemSchema = document.createElement('div');
  itemSchema.className = 'settings-item';
  itemSchema.innerHTML = `
    <div class="si-icon" style="background:#FFF3E0">🔍</div>
    <div class="si-text"><div class="si-label">Estrutura do banco</div><div class="si-desc">Object stores e índices</div></div>
    <span class="si-arrow">›</span>
  `;
  itemSchema.addEventListener('click', () => showDBSchema(ps));
  grpDB.appendChild(itemSchema);

  section.appendChild(grpDB);

  // Logout
  const grpDanger = document.createElement('div');
  grpDanger.className = 'settings-group';
  const itemLogout = document.createElement('div');
  itemLogout.className = 'settings-item';
  itemLogout.innerHTML = `
    <div class="si-icon" style="background:var(--red-bg)">🚪</div>
    <div class="si-text"><div class="si-label" style="color:var(--red)">Sair da conta</div><div class="si-desc">Encerra a sessão</div></div>
  `;
  itemLogout.addEventListener('click', () => {
    sessionStorage.removeItem('nof_session');
    state.user = null;
    state.clients = [];
    go('login');
  });
  grpDanger.appendChild(itemLogout);
  section.appendChild(grpDanger);

  body.appendChild(section);
  ps.appendChild(body);
}

async function exportData(){
  const clients = await dbGetAllClients();
  const txs     = await dbGetAllTransactions();
  const blob = new Blob([JSON.stringify({ clientes: clients, transacoes: txs }, null, 2)],
    { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `nof_backup_${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado!');
}

function showDBSchema(ps){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.zIndex = '200';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';

  const schema = `// IndexedDB — Object Stores

usuarios {
  id:        AutoIncrement (keyPath)
  usuario:   string (index único)
  senha:     string
  nome:      string
  criado_em: string (ISO date)
}

clientes {
  id:        AutoIncrement (keyPath)
  nome:      string
  telefone:  string
  limite:    number
  cor:       string (hex)
  iniciais:  string
  criado_em: string (ISO date)
}

transacoes {
  id:         AutoIncrement (keyPath)
  clienteId:  number (index)
  tipo:       "fiado" | "pag"
  valor:      number
  descricao:  string
  data:       string (YYYY-MM-DD)
  criado_em:  string (ISO date)
}`;

  sheet.innerHTML = `
    <div class="modal-title">Estrutura do Banco</div>
    <pre style="font-family:monospace;font-size:.63rem;color:var(--gray-700);white-space:pre-wrap;line-height:1.6;background:var(--gray-50);border-radius:8px;padding:12px;">${schema}</pre>
    <button class="btn-save" style="margin-top:12px" id="schemaClose">Fechar</button>
  `;
  sheet.querySelector('#schemaClose').addEventListener('click', () => overlay.remove());
  overlay.appendChild(sheet);
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  ps.appendChild(overlay);
}

render();      // exibe loading imediatamente
