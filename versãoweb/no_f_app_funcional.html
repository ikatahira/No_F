<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>No_F – Controle de Fiado</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g-dark:#1E3A08;--g-main:#3B6D11;--g-mid:#4A8018;--g-btn:#4A7C1A;
  --g-light:#5A9B22;--g-pale:#EAF3DC;--g-bg:#F5F8F0;
  --orange:#E07A2B;--orange-bg:#FEF1E6;--red:#D13030;--red-bg:#FDEAEA;
  --white:#FFFFFF;--gray-50:#F9F9F7;--gray-100:#F0F0EC;--gray-200:#E0E0D8;
  --gray-400:#A8A89E;--gray-600:#6A6A60;--gray-700:#4A4A44;--gray-800:#252520;
  --radius:14px;--shadow:0 2px 12px rgba(30,58,8,.12);
}
body{font-family:'DM Sans',sans-serif;background:#111D08;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;gap:0;}

/* HEADER */
.app-header{text-align:center;margin-bottom:32px;color:#fff;}
.app-header h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.app-header h1 span{color:#8DC948}
.app-header p{font-size:.85rem;color:#7CA84A;margin-top:4px;letter-spacing:.5px;}

/* PHONE SHELL */
.phone-wrap{display:flex;flex-direction:column;align-items:center;}
.phone{width:320px;background:#0A0A0A;border-radius:44px;padding:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;}
.phone::before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:90px;height:5px;background:#1a1a1a;border-radius:3px;}
.phone-screen{background:#fff;border-radius:32px;overflow:hidden;height:640px;
  display:flex;flex-direction:column;position:relative;}

/* STATUS BAR */
.status-bar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 18px 4px;font-size:.7rem;font-weight:600;flex-shrink:0;}
.status-bar.dark{background:var(--g-dark);color:rgba(255,255,255,.9)}
.status-bar.light{background:#fff;color:var(--gray-800)}
.sb-right{display:flex;gap:4px;align-items:center}

/* BOTTOM NAV */
.bottom-nav{display:flex;justify-content:space-around;align-items:center;
  padding:10px 8px 12px;border-top:1px solid var(--gray-200);background:#fff;
  flex-shrink:0;}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.6rem;color:var(--gray-400);font-weight:500;cursor:pointer;}
.bn-item.active{color:var(--g-btn)}
.bn-item svg{width:18px;height:18px}
.bn-plus{width:40px;height:40px;border-radius:50%;background:var(--g-btn);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;
  margin-top:-18px;box-shadow:0 3px 10px rgba(74,124,26,.4);cursor:pointer;}

/* SCREEN BODY */
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.screen-body::-webkit-scrollbar{display:none}

/* SPLASH / LOGIN */
.screen-splash{background:var(--g-dark);height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 28px;}
.splash-logo-ring{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.splash-logo-ring svg{width:36px;height:36px;color:#fff}
.splash-app-name{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;
  color:#fff;letter-spacing:-2px;line-height:1;}
.splash-tagline{font-size:.8rem;color:rgba(255,255,255,.55);margin-bottom:36px;margin-top:4px;}
.splash-field{width:100%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);
  border-radius:10px;padding:12px 16px;color:#fff;font-family:'DM Sans',sans-serif;
  font-size:.9rem;margin-bottom:10px;outline:none;}
.splash-field::placeholder{color:rgba(255,255,255,.45)}
.btn-primary{width:100%;padding:14px;background:var(--g-light);color:#fff;border:none;
  border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;
  cursor:pointer;margin-top:6px;transition:background .15s;}
.btn-primary:hover{background:var(--g-mid)}
.splash-forgot{font-size:.78rem;color:rgba(255,255,255,.45);margin-top:14px;cursor:pointer;}
.splash-error{font-size:.78rem;color:#ff8080;margin-top:6px;text-align:center;}

/* DASHBOARD */
.dash-header{background:var(--g-dark);padding:14px 18px 18px;color:#fff;flex-shrink:0;}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;}
.dash-greeting{font-size:.8rem;color:rgba(255,255,255,.65)}
.dash-name{font-size:1rem;font-weight:600;color:#fff}
.dash-avatar{width:34px;height:34px;border-radius:50%;background:var(--g-light);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;}
.dash-total-label{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:16px}
.dash-total-value{font-size:2rem;font-weight:700;color:#fff;letter-spacing:-1px;line-height:1.1}
.dash-subtitle{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:2px}
.dash-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 0;}
.dash-card{background:var(--g-bg);border-radius:10px;padding:10px 12px;}
.dash-card-label{font-size:.68rem;color:var(--gray-600)}
.dash-card-value{font-size:1rem;font-weight:700;color:var(--gray-800);margin-top:2px}
.dash-card-value.red{color:var(--red)}
.dash-devedores{padding:0 14px;margin-top:12px;}
.dash-section-title{font-size:.72rem;font-weight:600;color:var(--gray-600);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.client-row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--gray-100);cursor:pointer;}
.client-row:last-child{border-bottom:none}
.client-row:hover{background:var(--gray-50);margin:0 -4px;padding:9px 4px;}

/* AVATARS */
.avatar-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0;}
.client-info{flex:1}
.client-name{font-size:.82rem;font-weight:600;color:var(--gray-800)}
.client-meta{font-size:.68rem;color:var(--gray-400)}
.client-value{font-size:.85rem;font-weight:700;color:var(--red);text-align:right}

/* LISTA CLIENTES */
.list-header{padding:16px 16px 12px;flex-shrink:0;}
.list-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.list-title{font-size:1.3rem;font-weight:700;color:var(--gray-800)}
.dot-online{width:14px;height:14px;border-radius:50%;background:var(--g-light);
  box-shadow:0 0 0 3px rgba(90,155,34,.2);}
.search-box{width:100%;background:var(--gray-100);border:none;border-radius:10px;
  padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:.83rem;color:var(--gray-800);
  outline:none;margin-bottom:10px;}
.search-box::placeholder{color:var(--gray-400)}
.filter-tabs{display:flex;gap:6px;margin-bottom:4px}
.filter-tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--gray-200);
  font-size:.72rem;font-weight:600;background:#fff;color:var(--gray-600);cursor:pointer;}
.filter-tab.active{background:var(--g-btn);border-color:var(--g-btn);color:#fff;}
.client-list-item{display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--gray-100);cursor:pointer;}
.client-list-item:hover{background:var(--gray-50)}
.cli-info{flex:1}
.cli-name{font-size:.85rem;font-weight:600;color:var(--gray-800)}
.cli-time{font-size:.68rem;color:var(--gray-400)}
.cli-right{text-align:right}
.cli-value{font-size:.85rem;font-weight:700;color:var(--red)}
.cli-status{font-size:.65rem;font-weight:600;margin-top:2px}
.cli-status.devendo{color:var(--red)}
.cli-status.quite{color:var(--g-light)}
.chevron{color:var(--gray-400);font-size:.7rem;margin-left:4px}

/* PERFIL CLIENTE */
.profile-header{padding:12px 16px 16px;flex-shrink:0;}
.back-link{font-size:.75rem;color:var(--g-btn);display:flex;align-items:center;gap:4px;
  margin-bottom:10px;cursor:pointer;}
.profile-top{display:flex;align-items:center;gap:10px}
.profile-name{font-size:1rem;font-weight:700;color:var(--gray-800)}
.profile-phone{font-size:.75rem;color:var(--gray-400)}
.profile-balances{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px;}
.balance-box{background:var(--gray-50);border-radius:10px;padding:10px 12px;}
.balance-label{font-size:.68rem;color:var(--gray-600)}
.balance-value{font-size:1.05rem;font-weight:700;color:var(--gray-800);margin-top:2px}
.balance-value.red{color:var(--red)}
.profile-actions{display:flex;gap:8px;padding:0 16px 14px;}
.btn-action{flex:1;padding:10px;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.78rem;font-weight:600;border:none;cursor:pointer;transition:.15s;}
.btn-green{background:var(--g-btn);color:#fff}
.btn-outline{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-200)}
.btn-red-outline{background:#fff;color:var(--red);border:1.5px solid #F5C0C0}
.hist-section{padding:0 16px}
.hist-item{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--gray-100);}
.hist-icon{width:28px;height:28px;border-radius:8px;background:var(--red-bg);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;
  color:var(--red);flex-shrink:0;}
.hist-icon.pag{background:var(--g-pale);color:var(--g-btn)}
.hist-desc{font-size:.82rem;font-weight:500;color:var(--gray-800)}
.hist-date{font-size:.67rem;color:var(--gray-400)}
.hist-value{font-size:.85rem;font-weight:700;color:var(--red);margin-left:auto;white-space:nowrap;}
.hist-value.green{color:var(--g-btn)}

/* LANÇAMENTO */
.launch-header{padding:14px 16px 12px;flex-shrink:0;}
.launch-title{font-size:1.1rem;font-weight:700;color:var(--gray-800);margin-bottom:12px}
.tab-pills{display:flex;gap:6px;margin-bottom:0}
.tab-pill{padding:6px 16px;border-radius:20px;border:1.5px solid var(--gray-200);
  font-size:.78rem;font-weight:600;background:#fff;color:var(--gray-600);cursor:pointer;}
.tab-pill.active{background:var(--g-btn);border-color:var(--g-btn);color:#fff;}
.launch-body{padding:14px 16px}
.field-label{font-size:.72rem;font-weight:600;color:var(--gray-600);margin-bottom:4px}
.field-input{width:100%;background:var(--gray-100);border:1.5px solid var(--gray-200);
  border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:.88rem;
  color:var(--gray-800);outline:none;margin-bottom:12px;}
.field-input:focus{border-color:var(--g-btn)}
.client-selector{display:flex;align-items:center;gap:6px;padding:10px 14px;
  background:var(--gray-100);border-radius:10px;margin-bottom:12px;cursor:pointer;}
.cs-name{font-size:.88rem;font-weight:600;color:var(--gray-800)}
.cs-arrow{font-size:.7rem;color:var(--g-btn);margin-left:auto}
.saldo-alert{background:var(--red-bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;}
.sa-label{font-size:.68rem;color:var(--red);font-weight:600}
.sa-value{font-size:1.1rem;font-weight:700;color:var(--red)}
.btn-save{width:100%;padding:14px;background:var(--g-btn);color:#fff;border:none;
  border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;
  cursor:pointer;margin-bottom:10px;}
.btn-cancel{width:100%;padding:12px;background:#fff;color:var(--gray-600);
  border:1.5px solid var(--gray-200);border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:500;cursor:pointer;}

/* RELATÓRIO */
.report-header{padding:14px 16px 12px;flex-shrink:0;}
.report-title{font-size:1.2rem;font-weight:700;color:var(--gray-800);margin-bottom:12px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.report-box{background:var(--gray-50);border-radius:10px;padding:10px 12px}
.rb-label{font-size:.68rem;color:var(--gray-600)}
.rb-value{font-size:1rem;font-weight:700;margin-top:2px}
.rb-value.green{color:var(--g-main)}
.rb-value.red{color:var(--red)}
.rb-value.orange{color:var(--orange)}
.rb-value.dark{color:var(--gray-800)}
.alert-banner{background:var(--orange);border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ab-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0}
.ab-text{font-size:.78rem;font-weight:600;color:#fff}
.section-label{font-size:.72rem;font-weight:600;color:var(--gray-600);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.report-client-row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--gray-100);}
.cobrar-btn{display:flex;align-items:center;gap:6px;background:var(--g-btn);color:#fff;
  border-radius:20px;padding:8px 14px;font-size:.73rem;font-weight:600;cursor:pointer;
  margin:8px 0;border:none;}
.cobrar-btn svg{width:14px;height:14px}

/* CADASTRO */
.cadastro-header{padding:14px 16px 12px;flex-shrink:0;}
.cad-back{font-size:.75rem;color:var(--g-btn);cursor:pointer;margin-bottom:4px;}
.cad-title{font-size:1.2rem;font-weight:700;color:var(--gray-800)}
.cad-body{padding:14px 16px}

/* MODAL / OVERLAY */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:flex-end;border-radius:32px;overflow:hidden;}
.modal-sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 28px;
  max-height:80%;}
.modal-title{font-size:1rem;font-weight:700;color:var(--gray-800);margin-bottom:16px}
.modal-client-item{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--gray-100);cursor:pointer;}
.modal-client-item:last-child{border-bottom:none}
.modal-client-item:hover{background:var(--gray-50);margin:0 -4px;padding:10px 4px;}

/* TOAST */
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--g-dark);color:#fff;padding:9px 18px;border-radius:20px;
  font-size:.78rem;font-weight:600;z-index:100;white-space:nowrap;
  animation:fadeUpDown 2.5s ease forwards;}
@keyframes fadeUpDown{0%{opacity:0;transform:translateX(-50%) translateY(10px)}
  15%{opacity:1;transform:translateX(-50%) translateY(0)}
  80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}

/* CONFIRM DIALOG */
.confirm-dialog{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;border-radius:32px;}
.confirm-box{background:#fff;border-radius:16px;padding:20px;margin:24px;width:100%;}
.confirm-title{font-size:.95rem;font-weight:700;color:var(--gray-800);margin-bottom:6px}
.confirm-text{font-size:.8rem;color:var(--gray-600);margin-bottom:16px}
.confirm-btns{display:flex;gap:8px;}
.confirm-btn{flex:1;padding:10px;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.85rem;font-weight:600;border:none;cursor:pointer;}
.confirm-btn.cancel{background:var(--gray-100);color:var(--gray-700)}
.confirm-btn.danger{background:var(--red);color:#fff}
</style>
</head>
<body>

<div class="app-header">
  <h1>No<span>_F</span></h1>
  <p>CONTROLE DE FIADO · Paulo Eduardo Ananias · Fatec Ourinhos 2026</p>
</div>

<div class="phone-wrap">
  <div class="phone">
    <div class="phone-screen" id="phoneScreen"></div>
  </div>
</div>

<script>
// ─── ESTADO GLOBAL ────────────────────────────────────────────────────────
const COLORS = ['#2E7D32','#8B4513','#1565C0','#6A1B9A','#00695C','#E65100','#37474F','#880E4F'];
let colorIdx = 0;

const state = {
  user: null,
  clients: [],   // {id, name, phone, limit, color, initials, transactions:[]}
  activeClientId: null,
  screen: 'login',
  prevScreen: null,
  launchMode: 'fiado',   // 'fiado' | 'pag'
  filterClients: 'todos', // 'todos'|'devendo'|'quite'
  searchQuery: '',
  pickingClientFor: null, // 'fiado'|'pag'
};

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function fmt(v){ return 'R$ '+v.toFixed(2).replace('.',','); }

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
}

function relDate(iso){
  const diff = Date.now()-new Date(iso).getTime();
  const days = Math.floor(diff/86400000);
  if(days===0) return 'hoje';
  if(days===1) return 'ontem';
  return `há ${days} dias`;
}

function saldo(c){
  return c.transactions.reduce((acc,t)=> t.type==='fiado'? acc+t.value : acc-t.value, 0);
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function nextColor(){
  const c = COLORS[colorIdx % COLORS.length];
  colorIdx++;
  return c;
}

function clientById(id){ return state.clients.find(c=>c.id===id); }

function activeClient(){ return clientById(state.activeClientId); }

function toast(msg){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('phoneScreen').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

// ─── NAVEGAÇÃO ────────────────────────────────────────────────────────────
function go(screen, prev=null){
  state.prevScreen = prev || state.screen;
  state.screen = screen;
  render();
}

// ─── RENDER PRINCIPAL ─────────────────────────────────────────────────────
function render(){
  const ps = document.getElementById('phoneScreen');
  ps.innerHTML = '';
  const screens = {
    login: renderLogin,
    dashboard: renderDashboard,
    clientes: renderClientes,
    perfil: renderPerfil,
    lancamento: renderLancamento,
    relatorio: renderRelatorio,
    cadastro: renderCadastro,
  };
  (screens[state.screen] || renderLogin)(ps);
}

// ─── BOTTOM NAV ───────────────────────────────────────────────────────────
function navIcons(){
  return {
    home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>`,
    users: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`,
    report: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  };
}

function bottomNav(active){
  const ic = navIcons();
  const div = document.createElement('div');
  div.className = 'bottom-nav';
  div.innerHTML = `
    <div class="bn-item ${active==='home'?'active':''}" data-nav="dashboard">${ic.home}Início</div>
    <div class="bn-item ${active==='clientes'?'active':''}" data-nav="clientes">${ic.users}Clientes</div>
    <div class="bn-plus" id="btnPlus">+</div>
    <div class="bn-item ${active==='relatorio'?'active':''}" data-nav="relatorio">${ic.report}Relatório</div>
  `;
  div.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>go(el.dataset.nav));
  });
  div.getElementById = null; // not valid on div, use querySelector
  div.querySelector('#btnPlus').addEventListener('click',()=>{
    state.pickingClientFor = null;
    state.launchMode = 'fiado';
    go('lancamento');
  });
  return div;
}

function statusBar(dark=false){
  const bar = document.createElement('div');
  bar.className = `status-bar ${dark?'dark':'light'}`;
  const now = new Date();
  bar.innerHTML = `<span>${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}</span><div class="sb-right">●●●</div>`;
  return bar;
}

function avatarCircle(c, size=32, fontSize='.7rem'){
  const el = document.createElement('div');
  el.className = 'avatar-circle';
  el.style.cssText = `background:${c.color};width:${size}px;height:${size}px;font-size:${fontSize};`;
  el.textContent = c.initials;
  return el;
}

// ─── TELA LOGIN ───────────────────────────────────────────────────────────
function renderLogin(ps){
  const div = document.createElement('div');
  div.className = 'screen-splash';
  div.style.height = '100%';
  div.innerHTML = `
    <div class="splash-logo-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
    </div>
    <div class="splash-app-name">No_F</div>
    <div class="splash-tagline">controle de fiado</div>
    <input id="loginUser" class="splash-field" type="text" placeholder="Usuário" value="">
    <input id="loginPass" class="splash-field" type="password" placeholder="Senha" value="">
    <button class="btn-primary" id="btnEntrar" style="margin-top:8px">Entrar</button>
    <div class="splash-forgot">Esqueci a senha</div>
    <div class="splash-error" id="loginErr" style="display:none"></div>
  `;
  ps.appendChild(div);
  div.querySelector('#btnEntrar').addEventListener('click',()=>{
    const u = div.querySelector('#loginUser').value.trim();
    const p = div.querySelector('#loginPass').value;
    if(!u || !p){
      const err = div.querySelector('#loginErr');
      err.textContent = 'Preencha usuário e senha';
      err.style.display='block';
      return;
    }
    const saved = JSON.parse(localStorage.getItem('nof_user')||'null');
    if(saved && (saved.user!==u || saved.pass!==p)){
      const err = div.querySelector('#loginErr');
      err.textContent = 'Usuário ou senha incorretos';
      err.style.display='block';
      return;
    }
    if(!saved){
      localStorage.setItem('nof_user', JSON.stringify({user:u, pass:p, name:u}));
    }
    state.user = saved || {user:u, pass:p, name:u};
    loadData();
    go('dashboard');
  });
}

// ─── TELA DASHBOARD ───────────────────────────────────────────────────────
function renderDashboard(ps){
  const totalAberto = state.clients.reduce((acc,c)=>acc+Math.max(0,saldo(c)),0);
  const comDebito = state.clients.filter(c=>saldo(c)>0);
  const hoje = today();
  const fiadoHoje = state.clients.flatMap(c=>c.transactions)
    .filter(t=>t.type==='fiado' && t.date===hoje)
    .reduce((a,t)=>a+t.value,0);
  const pagHoje = state.clients.flatMap(c=>c.transactions)
    .filter(t=>t.type==='pag' && t.date===hoje)
    .reduce((a,t)=>a+t.value,0);

  const top = comDebito.sort((a,b)=>saldo(b)-saldo(a)).slice(0,3);
  const nome = state.user?.name || 'Comerciante';
  const ini = nome.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const diaSem = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});

  ps.appendChild(statusBar(true));

  const header = document.createElement('div');
  header.className = 'dash-header';
  header.innerHTML = `
    <div class="dash-top">
      <div>
        <div class="dash-greeting">Bom dia, ${nome.split(' ')[0]}</div>
        <div style="font-size:.72rem;color:rgba(255,255,255,.5)">${diaSem}</div>
      </div>
      <div class="dash-avatar">${ini}</div>
    </div>
    <div class="dash-total-label" style="margin-top:14px">Total a receber</div>
    <div class="dash-total-value">${fmt(totalAberto)}</div>
    <div class="dash-subtitle">${state.clients.length} clientes · ${comDebito.length} com débito</div>
  `;
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';
  body.innerHTML = `
    <div class="dash-cards">
      <div class="dash-card"><div class="dash-card-label">Clientes</div><div class="dash-card-value">${state.clients.length}</div></div>
      <div class="dash-card"><div class="dash-card-label">Com débito</div><div class="dash-card-value red">${comDebito.length}</div></div>
      <div class="dash-card"><div class="dash-card-label">Fiado hoje</div><div class="dash-card-value">${fiadoHoje>0?fmt(fiadoHoje):'—'}</div></div>
      <div class="dash-card"><div class="dash-card-label">Recebido hoje</div><div class="dash-card-value" style="color:var(--g-main)">${pagHoje>0?fmt(pagHoje):'—'}</div></div>
    </div>
    <div class="dash-devedores" style="padding-top:14px">
      <div class="dash-section-title">Maiores devedores</div>
      ${top.length===0?`<div style="font-size:.8rem;color:var(--gray-400);padding:12px 0;">Nenhum devedor 🎉</div>`:''}
    </div>
  `;
  top.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'client-row';
    row.appendChild(avatarCircle(c));
    row.innerHTML += `
      <div class="client-info">
        <div class="client-name">${c.name}</div>
        <div class="client-meta">${relDate(c.transactions[c.transactions.length-1]?.date||today())}</div>
      </div>
      <div class="client-value">${fmt(saldo(c))}</div>
    `;
    row.addEventListener('click',()=>{ state.activeClientId=c.id; go('perfil','dashboard'); });
    body.querySelector('.dash-devedores').appendChild(row);
  });
  ps.appendChild(body);
  ps.appendChild(bottomNav('home'));
}

// ─── TELA CLIENTES ────────────────────────────────────────────────────────
function renderClientes(ps){
  ps.appendChild(statusBar());

  const header = document.createElement('div');
  header.className = 'list-header';
  header.innerHTML = `
    <div class="list-title-row">
      <div class="list-title">Clientes</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="dot-online"></div>
        <div style="font-size:.72rem;color:var(--g-btn);cursor:pointer;font-weight:600;" id="btnAddCli">+ Novo</div>
      </div>
    </div>
    <input class="search-box" id="searchBox" placeholder="Buscar cliente..." value="${state.searchQuery}">
    <div class="filter-tabs">
      <div class="filter-tab ${state.filterClients==='todos'?'active':''}" data-f="todos">Todos</div>
      <div class="filter-tab ${state.filterClients==='devendo'?'active':''}" data-f="devendo">Devedores</div>
      <div class="filter-tab ${state.filterClients==='quite'?'active':''}" data-f="quite">Quite</div>
    </div>
  `;
  header.querySelector('#btnAddCli').addEventListener('click',()=>go('cadastro','clientes'));
  header.querySelector('#searchBox').addEventListener('input', e=>{
    state.searchQuery = e.target.value;
    render();
  });
  header.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('click',()=>{ state.filterClients=el.dataset.f; render(); });
  });
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';

  let list = [...state.clients];
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    list = list.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
  }
  if(state.filterClients==='devendo') list = list.filter(c=>saldo(c)>0);
  if(state.filterClients==='quite') list = list.filter(c=>saldo(c)<=0);

  if(list.length===0){
    body.innerHTML = `<div style="text-align:center;padding:32px 16px;color:var(--gray-400);font-size:.85rem;">
      ${state.clients.length===0?'Nenhum cliente cadastrado ainda.<br><br>Toque em <b>+ Novo</b> para começar.':'Nenhum cliente encontrado.'}
    </div>`;
  } else {
    list.forEach(c=>{
      const s = saldo(c);
      const last = c.transactions[c.transactions.length-1];
      const row = document.createElement('div');
      row.className = 'client-list-item';
      row.appendChild(avatarCircle(c));
      row.innerHTML += `
        <div class="cli-info">
          <div class="cli-name">${c.name}</div>
          <div class="cli-time">${last?relDate(last.date):'sem lançamentos'}</div>
        </div>
        <div class="cli-right">
          <div class="cli-value" style="${s<=0?'color:var(--gray-400)':''}">${s>0?fmt(s):'—'}</div>
          <div class="cli-status ${s>0?'devendo':'quite'}">${s>0?'devendo':'quite'}</div>
        </div>
        <span class="chevron">›</span>
      `;
      row.addEventListener('click',()=>{ state.activeClientId=c.id; go('perfil','clientes'); });
      body.appendChild(row);
    });
  }
  ps.appendChild(body);
  ps.appendChild(bottomNav('clientes'));
}

// ─── TELA PERFIL CLIENTE ──────────────────────────────────────────────────

function showConfirmDelete(c){
  const ps = document.getElementById('phoneScreen');
  const overlay = document.createElement('div');
  overlay.className = 'confirm-dialog';
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-title">Excluir ${c.name}?</div>
      <div class="confirm-text">Todos os lançamentos também serão apagados. Esta ação não pode ser desfeita.</div>
      <div class="confirm-btns">
        <button class="confirm-btn cancel" id="cbCancel">Cancelar</button>
        <button class="confirm-btn danger" id="cbDel">Excluir</button>
      </div>
    </div>
  `;
  overlay.querySelector('#cbCancel').addEventListener('click',()=>overlay.remove());
  overlay.querySelector('#cbDel').addEventListener('click',()=>{
    state.clients = state.clients.filter(x=>x.id!==c.id);
    saveData();
    go('clientes');
    toast(`${c.name} excluído`);
  });
  ps.appendChild(overlay);
}

// ─── TELA LANÇAMENTO ──────────────────────────────────────────────────────
function renderLancamento(ps){
  // se veio do perfil, pré-seleciona o cliente
  const preClient = state.prevScreen==='perfil' ? activeClient() : null;
  let selectedClient = preClient;

  ps.appendChild(statusBar());

  const header = document.createElement('div');
  header.className = 'launch-header';
  header.innerHTML = `
    <div class="launch-title">Novo lançamento</div>
    <div class="tab-pills">
      <div class="tab-pill ${state.launchMode==='fiado'?'active':''}" id="tabFiado">Fiado</div>
      <div class="tab-pill ${state.launchMode==='pag'?'active':''}" id="tabPag">Pagamento</div>
    </div>
  `;
  header.querySelector('#tabFiado').addEventListener('click',()=>{ state.launchMode='fiado'; renderLancamento(ps); ps.innerHTML=''; renderLancamento(ps); });
  header.querySelector('#tabPag').addEventListener('click',()=>{ state.launchMode='pag'; renderLancamento(ps); ps.innerHTML=''; renderLancamento(ps); });
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';

  const form = document.createElement('div');
  form.className = 'launch-body';

  // Cliente selector
  const fieldCli = document.createElement('div');
  fieldCli.innerHTML = `<div class="field-label">Cliente</div>`;
  const clientSel = document.createElement('div');
  clientSel.className = 'client-selector';
  const updateClientSel = ()=>{
    clientSel.innerHTML = selectedClient
      ? `<div style="width:26px;height:26px;border-radius:50%;background:${selectedClient.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;">${selectedClient.initials}</div><span class="cs-name">${selectedClient.name}</span><span class="cs-arrow">›</span>`
      : `<span class="cs-name" style="color:var(--gray-400)">Selecionar cliente</span><span class="cs-arrow">›</span>`;
  };
  updateClientSel();
  clientSel.addEventListener('click',()=>{
    showClientPicker(ps, (c)=>{ selectedClient=c; updateClientSel(); updateSaldo(); });
  });
  fieldCli.appendChild(clientSel);
  form.appendChild(fieldCli);

  // Saldo alert (pagamento)
  const saldoAlert = document.createElement('div');
  const updateSaldo = ()=>{
    if(state.launchMode==='pag' && selectedClient){
      const s = saldo(selectedClient);
      saldoAlert.innerHTML = `<div class="saldo-alert"><div class="sa-label">Saldo devedor</div><div class="sa-value">${fmt(Math.max(0,s))}</div></div>`;
    } else {
      saldoAlert.innerHTML = '';
    }
  };
  updateSaldo();
  form.appendChild(saldoAlert);

  // Descrição (só fiado)
  if(state.launchMode==='fiado'){
    form.innerHTML += `<div class="field-label">Descrição</div><input class="field-input" id="fDesc" type="text" placeholder="Ex: 1 kg arroz, 2 pães...">`;
  }

  // Valor
  form.innerHTML += `<div class="field-label">Valor (R$)</div><input class="field-input" id="fValor" type="number" min="0.01" step="0.01" placeholder="0,00">`;

  // Data
  form.innerHTML += `<div class="field-label">Data</div><input class="field-input" id="fData" type="date" value="${today()}">`;

  // Observação (pagamento)
  if(state.launchMode==='pag'){
    form.innerHTML += `<div class="field-label">Observação</div><input class="field-input" id="fObs" type="text" placeholder="Opcional">`;
  }

  // Botão
  const btnSave = document.createElement('button');
  btnSave.className = 'btn-save';
  btnSave.textContent = state.launchMode==='fiado' ? 'Registrar fiado' : 'Confirmar pagamento';
  btnSave.style.marginTop = '8px';
  btnSave.addEventListener('click',()=>{
    if(!selectedClient){ toast('Selecione um cliente'); return; }
    const valor = parseFloat(form.querySelector('#fValor')?.value||'0');
    if(!valor||valor<=0){ toast('Informe um valor válido'); return; }
    const desc = state.launchMode==='fiado'
      ? (form.querySelector('#fDesc')?.value||'')
      : (form.querySelector('#fObs')?.value||'Pagamento');
    const data = form.querySelector('#fData')?.value||today();
    selectedClient.transactions.push({
      id: genId(),
      type: state.launchMode,
      value: valor,
      desc,
      date: data,
    });
    saveData();
    state.activeClientId = selectedClient.id;
    toast(state.launchMode==='fiado' ? `Fiado de ${fmt(valor)} registrado!` : `Pagamento de ${fmt(valor)} confirmado!`);
    go('perfil', 'clientes');
  });
  form.appendChild(btnSave);

  body.appendChild(form);
  ps.appendChild(body);

  const nav = bottomNav(state.launchMode==='fiado'?'':'relatorio');
  ps.appendChild(nav);
}

function showClientPicker(ps, onSelect){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.innerHTML = `<div class="modal-title">Selecionar cliente</div>`;
  if(state.clients.length===0){
    sheet.innerHTML += `<div style="font-size:.82rem;color:var(--gray-400);">Nenhum cliente cadastrado.</div>`;
  } else {
    state.clients.forEach(c=>{
      const item = document.createElement('div');
      item.className = 'modal-client-item';
      item.innerHTML = `
        <div style="width:32px;height:32px;border-radius:50%;background:${c.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;">${c.initials}</div>
        <div class="cli-info"><div class="cli-name">${c.name}</div><div class="cli-time">${c.phone||''}</div></div>
      `;
      item.addEventListener('click',()=>{ onSelect(c); overlay.remove(); });
      sheet.appendChild(item);
    });
  }
  overlay.appendChild(sheet);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  ps.appendChild(overlay);
}

  header.className = 'cadastro-header';
  header.innerHTML = `
    <div class="cad-back" id="cadBack">‹ Clientes</div>
    <div class="cad-title">Novo cliente</div>
  `;
  header.querySelector('#cadBack').addEventListener('click',()=>go('clientes'));
  ps.appendChild(header);

  const body = document.createElement('div');
  body.className = 'screen-body';

  const form = document.createElement('div');
  form.className = 'cad-body';
  form.innerHTML = `
    <div class="field-label">Nome completo *</div>
    <input class="field-input" id="cadNome" type="text" placeholder="Nome do cliente">
    <div class="field-label">Telefone (WhatsApp)</div>
    <input class="field-input" id="cadTel" type="tel" placeholder="(xx) 9xxxx-xxxx">
    <div class="field-label">Limite de crédito (R$)</div>
    <input class="field-input" id="cadLimite" type="number" min="0" step="0.01" placeholder="0,00">
  `;

  const btnSave = document.createElement('button');
  btnSave.className = 'btn-save';
  btnSave.textContent = 'Salvar cliente';
  btnSave.style.marginTop = '16px';
  btnSave.addEventListener('click',()=>{
    const nome = form.querySelector('#cadNome').value.trim();
    if(!nome){ toast('Informe o nome do cliente'); return; }
    const phone = form.querySelector('#cadTel').value.trim();
    const limit = parseFloat(form.querySelector('#cadLimite').value)||0;
    const c = {
      id: genId(),
      name: nome,
      phone,
      limit,
      color: nextColor(),
      initials: initials(nome),
      transactions: [],
    };
    state.clients.push(c);
    saveData();
    toast(`${nome} cadastrado!`);
    go('clientes');
  });
  form.appendChild(btnSave);

  const btnCancel = document.createElement('button');
  btnCancel.className = 'btn-cancel';
  btnCancel.textContent = 'Cancelar';
  btnCancel.addEventListener('click',()=>go('clientes'));
  form.appendChild(btnCancel);

  body.appendChild(form);
  ps.appendChild(body);
}

// ─── PERSISTÊNCIA ─────────────────────────────────────────────────────────
function saveData(){
  localStorage.setItem('nof_clients', JSON.stringify(state.clients));
  localStorage.setItem('nof_colorIdx', colorIdx.toString());
}

function loadData(){
  const saved = JSON.parse(localStorage.getItem('nof_clients')||'[]');
  state.clients = saved;
  colorIdx = parseInt(localStorage.getItem('nof_colorIdx')||'0');
}

// ─── BOOT ─────────────────────────────────────────────────────────────────
const savedUser = JSON.parse(localStorage.getItem('nof_user')||'null');
if(savedUser){
  state.user = savedUser;
  loadData();
  state.screen = 'dashboard';
}
render();
</script>
</body>
</html>
